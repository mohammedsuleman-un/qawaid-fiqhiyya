<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المكتبة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f6f5; --surface:#ffffff; --ink:#1b2422; --muted:#5b6965; --line:#d6e0dd; --accent:#1e5b4f;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 4px 16px rgba(20,40,35,.06);
  --display:"Amiri","Traditional Arabic",serif; --body:"IBM Plex Sans Arabic","Segoe UI","Tahoma",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --bg:#0f1614; --surface:#16211e; --ink:#e4ebe8; --muted:#9aaba6; --line:#2a3a36; --accent:#6cbca6; --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark; --bg:#0f1614; --surface:#16211e; --ink:#e4ebe8; --muted:#9aaba6; --line:#2a3a36; --accent:#6cbca6; --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);direction:rtl}
.wrap{max-width:860px;margin:0 auto;padding:40px 16px 60px}
h1{font-family:var(--display);font-size:clamp(34px,6vw,48px);color:var(--accent);margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
a.card{display:block;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);color:var(--ink);text-decoration:none}
a.card:hover{border-color:var(--accent)}
.card h2{font-family:var(--display);font-size:26px;margin:0 0 6px;color:var(--accent)}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.tag{display:inline-block;margin-top:10px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>المكتبة</h1>
  <p class="sub">كتب ومذكرات في الفقه وأصوله</p>
  <div class="grid">
    <a class="card" href="index.html">
      <h2>القواعد الفقهية</h2>
      <p>مرجع تفاعلي للقواعد الفقهية الكبرى وفروعها، مع الأدلة من الكتاب والسنة والأمثلة.</p>
      <span class="tag">الفقه</span>
    </a>
    <a class="card" href="talkhis-jam-al-jawami/">
      <h2>تلخيص جمع الجوامع</h2>
      <p>مذكرات في أصول الفقه على جمع الجوامع لتاج الدين السبكي، مع ملف PDF.</p>
      <span class="tag">أصول الفقه</span>
    </a>
  </div>
</div>
</body>
</html>
