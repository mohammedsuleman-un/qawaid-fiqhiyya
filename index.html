<title>القواعد الفقهية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface2:#eaf0ee; --ink:#1b2422; --muted:#5b6965; --line:#d6e0dd;
  --accent:#1e5b4f; --accent-ink:#ffffff; --accent-soft:#dcebe6; --gold:#9a7424; --gold-soft:#f5ecd6; --quran:#0f5132; --hadith:#4a3a10;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 4px 16px rgba(20,40,35,.06);
  --display:"Amiri","Traditional Arabic",serif; --body:"IBM Plex Sans Arabic","Segoe UI","Tahoma",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0f1614; --surface:#16211e; --surface2:#1c2a27; --ink:#e4ebe8; --muted:#9aaba6; --line:#2a3a36;
  --accent:#6cbca6; --accent-ink:#0c1a16; --accent-soft:#1f3a33; --gold:#d6b560; --gold-soft:#2e2818; --quran:#8fd6b4; --hadith:#e2cf9a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1614; --surface:#16211e; --surface2:#1c2a27; --ink:#e4ebe8; --muted:#9aaba6; --line:#2a3a36;
  --accent:#6cbca6; --accent-ink:#0c1a16; --accent-soft:#1f3a33; --gold:#d6b560; --gold-soft:#2e2818; --quran:#8fd6b4; --hadith:#e2cf9a;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.85;direction:rtl}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:330px 1fr;height:100%}
aside{background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 10px}
.brand h1{font-family:var(--display);font-size:28px;line-height:1.3;margin:0;color:var(--accent);text-wrap:balance;cursor:pointer}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.search{padding:6px 18px 10px;display:flex;flex-direction:column;gap:8px}
.search input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:2px 12px;font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav{overflow-y:auto;padding:4px 10px 20px;flex:1;min-height:0}
.cat{margin-top:10px}
.cat-h{font-size:12.5px;font-weight:600;color:var(--muted);padding:4px 8px;letter-spacing:.2px}
.item{display:flex;gap:8px;align-items:baseline;width:100%;text-align:right;border:0;background:transparent;border-radius:8px;padding:5px 8px;font-size:14.5px;line-height:1.6}
.item:hover{background:var(--surface2)}
.item[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600}
.item .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:20px}
.item.major .t{color:var(--gold);font-weight:600}
.item .done{margin-right:auto;color:var(--accent);font-size:12px}
.empty{color:var(--muted);padding:10px;font-size:14px}

main{overflow-y:auto;min-height:0}
.wrap{max-width:780px;margin:0 auto;padding-block:28px 60px;padding-inline:24px}
.topbar{display:none}

.eyebrow{font-size:13px;color:var(--muted);margin:0 0 4px}
.rule-h{font-family:var(--display);font-size:clamp(28px,4.2vw,40px);line-height:1.4;margin:0;text-wrap:balance}
.major-tag{display:inline-block;background:var(--gold-soft);color:var(--gold);border-radius:99px;font-size:12.5px;padding:1px 12px;font-weight:600;margin-top:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:5px 14px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
section.blk{margin-top:22px}
section.blk h3{font-size:14px;font-weight:600;color:var(--accent);margin:0 0 6px;letter-spacing:.3px}
.meaning{font-size:17px}
.ev{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.ev li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.ev .q{font-family:var(--display);font-size:21px;line-height:1.9;color:var(--quran)}
.ev .h{color:var(--hadith)}
.ev .ref{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.sub-h{font-size:13px;color:var(--muted);margin:12px 0 6px}
ul.ex,ol.nt{margin:0;padding-inline-start:22px}
ul.ex li,ol.nt li{margin-bottom:6px}
ol.nt li::marker{color:var(--accent);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
.pager button{flex:1;text-align:right;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.5}
.pager button:last-child{text-align:left}
.pager small{display:block;color:var(--muted);font-size:12px}
.pager button:disabled{visibility:hidden}

.hero{padding:10px 0 8px}
.hero h2{font-family:var(--display);font-size:clamp(34px,5vw,50px);line-height:1.3;margin:0;color:var(--accent);text-wrap:balance}
.hero p{color:var(--muted);max-width:60ch}
.poem{font-family:var(--display);font-size:19px;line-height:2.1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin:18px 0}
.big5{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0 6px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:right;display:flex;flex-direction:column;gap:2px}
.card:hover{border-color:var(--gold)}
.card b{font-family:var(--display);font-size:21px;color:var(--gold);line-height:1.5}
.card span{font-size:13px;color:var(--muted)}
.progress{font-size:14px;color:var(--muted);margin-top:14px}
.bar{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.intro h3{font-size:18px;color:var(--accent);margin:26px 0 6px}
.intro ul{padding-inline-start:22px}
.intro .q{font-family:var(--display);color:var(--quran);font-size:18px}
.intro blockquote{display:none}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:6px 16px;border-radius:9px;font-size:14px}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0;z-index:20;transform:translateX(100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  aside.open{transform:none}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line);padding:8px 16px;align-items:center;gap:10px}
  .topbar b{font-family:var(--display);font-size:20px;color:var(--accent);flex:1}
  .close{display:inline-block!important}
  .wrap{padding-inline:16px;padding-block:18px 50px}
}
.close{display:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:2px 12px;font-size:14px;margin-inline-start:auto}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>

<div class="app">
  <aside id="side">
    <div class="brand">
      <div style="display:flex;align-items:center"><h1 id="home-link" tabindex="0">القواعد الفقهية</h1><button class="close" id="close">إغلاق</button></div>
      <p><span id="count"></span> قاعدة: المعنى والأدلة والأمثلة ونقاط الانتباه</p>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="ابحث في القواعد والأدلة والأمثلة…" aria-label="بحث">
      <div class="chips">
        <button class="chip" id="f-all" aria-pressed="true">الكل</button>
        <button class="chip" id="f-major" aria-pressed="false">الكبرى فقط</button>
        <button class="chip" id="f-todo" aria-pressed="false">لم أحفظها</button>
      </div>
    </div>
    <nav id="nav" aria-label="فهرس القواعد"></nav>
  </aside>
  <main id="main">
    <div class="topbar"><button class="btn" id="menu">الفهرس</button><b>القواعد الفقهية</b></div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const CATS = [{"cat": {"id": 1, "title": "القاعدة الكبرى الأولى: الأمور بمقاصدها", "short": "المقاصد والنيات"}, "rules": [{"id": "r1", "major": true, "title": "الأمور بمقاصدها", "meaning": "أي أن أعمال المكلّف وتصرفاته من قول أو فعل تختلف أحكامها الشرعية باختلاف قصده ونيته. فالفعل الواحد قد يكون عبادة يُثاب عليها، أو عادة مباحة، أو معصية، بحسب ما قصده صاحبه. والنية تميّز العبادات عن العادات، وتميّز العبادات بعضها عن بعض (كالفرض عن النفل، والظهر عن العصر).", "quran": [["﴿وَمَا أُمِرُوا إِلَّا لِيَعْبُدُوا اللَّهَ مُخْلِصِينَ لَهُ الدِّينَ﴾", "البينة: 5"], ["﴿وَمَن يَخْرُجْ مِن بَيْتِهِ مُهَاجِرًا إِلَى اللَّهِ وَرَسُولِهِ ثُمَّ يُدْرِكْهُ الْمَوْتُ فَقَدْ وَقَعَ أَجْرُهُ عَلَى اللَّهِ﴾", "النساء: 100"], ["﴿وَلَا تُمْسِكُوهُنَّ ضِرَارًا لِّتَعْتَدُوا﴾", "البقرة: 231"]], "sunnah": [["قوله ﷺ: «إنما الأعمال بالنيات، وإنما لكل امرئ ما نوى»", "البخاري 1، مسلم 1907"], ["قوله ﷺ: «إنك لن تنفق نفقةً تبتغي بها وجه الله إلا أُجرت عليها، حتى ما تجعل في فِي امرأتك»", "البخاري 56، مسلم 1628"]], "examples": ["الغسل: إن نوى به رفع الجنابة كان عبادة، وإن نوى به التبرّد كان عادة لا تُجزئ عن غسل الجنابة.", "دفع المال للفقير: إن نوى به الزكاة أجزأ عنها، وإن نوى الصدقة كان تطوعاً.", "الإمساك عن الطعام: بنية الصيام عبادة، وبغير نية لا يكون صياماً.", "النوم والأكل والعمل: إذا نوى بها التقوّي على الطاعة والإنفاق على الأهل صارت قربة يُؤجر عليها.", "من التقط لقطة بنية ردّها لصاحبها فهي أمانة في يده، ومن التقطها بنية تملّكها فهو غاصب ضامن."], "notes": ["<b>النية محلها القلب،</b> والتلفظ بها في العبادات غير مشروع على الصحيح، إلا ما ورد كالتلبية في الحج.", "<b>النية لا تُصلح العمل المحرّم:</b> فمن سرق ليتصدق لم تنفعه نيته، لأن العمل الصالح يُشترط فيه الإخلاص وموافقة الشرع معاً.", "<b>لا تُشترط النية في التروك</b> (كترك المحرمات) لبراءة الذمة، لكن الثواب على الترك يحتاج إلى نية الامتثال.", "<b>لا تُشترط النية في إزالة النجاسة</b> عند الجمهور، لأنها من باب التروك.", "<b>أثر النية في المعاملات:</b> ينظر الفقهاء إلى قصد المتعاقدين عند وجود قرائن تدل على التحايل، كما في نكاح التحليل وبيع العِينة."]}, {"id": "r2", "major": false, "title": "العبرة في العقود بالمقاصد والمعاني لا بالألفاظ والمباني", "meaning": "إذا تعارض اللفظ مع المقصود الظاهر في العقود، فالحكم للمعنى المقصود لا لمجرد الصيغة. فلا يُنظر إلى الشكل وحده إذا دلّت القرائن على أن المقصود شيء آخر.", "quran": [["﴿وَلَا تُمْسِكُوهُنَّ ضِرَارًا لِّتَعْتَدُوا﴾", "البقرة: 231"], ["﴿مِن بَعْدِ وَصِيَّةٍ يُوصَىٰ بِهَا أَوْ دَيْنٍ غَيْرَ مُضَارٍّ﴾", "النساء: 12"]], "sunnah": [["«لعن رسول الله ﷺ المحلِّل والمحلَّل له»، فالعقد صورته نكاح ومقصوده التحليل", "أبو داود 2076، الترمذي 1120"], ["قوله ﷺ: «إنما الأعمال بالنيات»", "البخاري 1، مسلم 1907"]], "examples": ["من قال: «وهبتك هذه السيارة بعشرة آلاف» فهو بيع لا هبة، لأن العبرة بالمعنى.", "من قال: «أعرتك هذا الكتاب بعشرين يورو شهرياً» فهو إجارة لا إعارة.", "الكفالة بشرط براءة الأصيل تكون حوالةً في المعنى عند جمع من الفقهاء.", "بيع العِينة: صورته بيعان صحيحان، ومقصوده قرض بفائدة، فمنعه جمهور العلماء."], "notes": ["القاعدة تُعمل عند وضوح المقصود بالقرائن، ولا يُحكم على نيات الناس بالظنون المجردة.", "في بعض العقود كالطلاق والعتق يؤخذ باللفظ الصريح في القضاء ولو ادعى خلافه، مع اختلاف بين المذاهب في التفاصيل."]}, {"id": "r3", "major": false, "title": "لا ثواب إلا بالنية", "meaning": "الأجر والثواب من الله على الأعمال لا يحصل إلا إذا قصد العامل بعمله وجه الله تعالى، سواء كان العمل عبادة محضة أو عادة مباحة.", "quran": [["﴿وَمَا لِأَحَدٍ عِندَهُ مِن نِّعْمَةٍ تُجْزَىٰ ۝ إِلَّا ابْتِغَاءَ وَجْهِ رَبِّهِ الْأَعْلَىٰ﴾", "الليل: 19-20"], ["﴿لَّا خَيْرَ فِي كَثِيرٍ مِّن نَّجْوَاهُمْ إِلَّا مَنْ أَمَرَ بِصَدَقَةٍ أَوْ مَعْرُوفٍ أَوْ إِصْلَاحٍ بَيْنَ النَّاسِ ۚ وَمَن يَفْعَلْ ذَٰلِكَ ابْتِغَاءَ مَرْضَاتِ اللَّهِ فَسَوْفَ نُؤْتِيهِ أَجْرًا عَظِيمًا﴾", "النساء: 114"]], "sunnah": [["«إنما الأعمال بالنيات»", "البخاري 1، مسلم 1907"], ["«إنك لن تنفق نفقةً تبتغي بها وجه الله إلا أُجرت عليها»", "البخاري 56، مسلم 1628"]], "examples": ["من أنفق على أهله محتسباً أُجر، ومن أنفق بلا نية برئت ذمته ولم يحصل له ثواب الاحتساب.", "من ترك الخمر خوفاً من الله أُثيب، ومن تركها لعدم رغبته فيها لم يأثم ولم يُثب.", "العمل في التجارة بنية إعفاف النفس والأهل يصير عبادة."], "notes": ["الفرق بين <b>صحة العمل</b> و<b>الثواب عليه</b>: قد يصح العمل في الظاهر وتبرأ به الذمة (كقضاء الدين) دون ثواب إن خلا من النية.", "الرياء يُحبط ثواب العمل الذي خالطه."]}, {"id": "r4", "major": false, "title": "اليمين على نية المستحلِف", "meaning": "إذا حلّف القاضي أو صاحب الحق شخصاً، فالعبرة بنية من طلب اليمين لا بنية الحالف، فلا تنفعه التورية لإسقاط حق غيره.", "quran": [["﴿وَلَا تَتَّخِذُوا أَيْمَانَكُمْ دَخَلًا بَيْنَكُمْ﴾", "النحل: 94"]], "sunnah": [["قوله ﷺ: «يمينك على ما يُصدِّقك عليه صاحبك»", "مسلم 1653"], ["وفي رواية: «اليمين على نية المستحلِف»", "مسلم 1653"]], "examples": ["من أنكر ديناً عليه وحلف عند القاضي «ما له عندي شيء» ناوياً شيئاً آخر، فيمينه غموس ولا تنفعه التورية.", "إذا كان الحالف مظلوماً فله أن يُورّي في يمينه ليدفع الظلم عن نفسه."], "notes": ["إذا لم يكن هناك مستحلِف (حلف ابتداءً) فالعبرة بنية الحالف إذا احتملها اللفظ.", "التورية جائزة للمظلوم، ومحرمة على الظالم الذي يريد أخذ حق غيره."]}]}, {"cat": {"id": 2, "title": "القاعدة الكبرى الثانية: اليقين لا يزول بالشك", "short": "اليقين والشك"}, "rules": [{"id": "r5", "major": true, "title": "اليقين لا يزول بالشك", "meaning": "ما ثبت بيقين، أو بغلبة ظن معتبرة، لا يرتفع بمجرد الشك الطارئ، بل لا بد لرفعه من يقين مثله. واليقين: ما جزم به القلب بدليل. والشك: التردد بين أمرين لا مرجّح لأحدهما. وهذه القاعدة من أعظم أسباب الطمأنينة ودفع الوسوسة.", "quran": [["﴿وَمَا يَتَّبِعُ أَكْثَرُهُمْ إِلَّا ظَنًّا ۚ إِنَّ الظَّنَّ لَا يُغْنِي مِنَ الْحَقِّ شَيْئًا﴾", "يونس: 36"], ["﴿يَا أَيُّهَا الَّذِينَ آمَنُوا اجْتَنِبُوا كَثِيرًا مِّنَ الظَّنِّ إِنَّ بَعْضَ الظَّنِّ إِثْمٌ﴾", "الحجرات: 12"]], "sunnah": [["شُكي إلى النبي ﷺ الرجل يُخيَّل إليه أنه يجد الشيء في الصلاة، فقال: «لا ينصرف حتى يسمع صوتاً أو يجد ريحاً»", "البخاري 137، مسلم 361"], ["قوله ﷺ: «إذا شكّ أحدكم في صلاته فلم يدرِ كم صلى، ثلاثاً أم أربعاً، فليطرح الشك وليبنِ على ما استيقن»", "مسلم 571"]], "examples": ["من تيقّن الطهارة وشكّ في الحدث فهو متطهّر، ومن تيقّن الحدث وشكّ في الطهارة فهو مُحدِث.", "من شكّ في عدد الركعات بنى على الأقل لأنه المتيقَّن، وسجد للسهو.", "من شكّ في طلاق زوجته لم يقع الطلاق، لأن النكاح ثابت بيقين.", "من شكّ في طلوع الفجر وهو يتسحّر فله أن يأكل، لأن الأصل بقاء الليل.", "من شكّ في غروب الشمس وهو صائم لم يجز له الفطر، لأن الأصل بقاء النهار.", "الثوب والأرض والماء: الأصل فيها الطهارة حتى تُتيقّن النجاسة."], "notes": ["<b>غلبة الظن تُلحق باليقين</b> في أكثر الأحكام العملية، فيُعمل بها عند تعذّر اليقين، كالاجتهاد في القبلة ودخول الوقت.", "<b>القاعدة علاج للوسوسة:</b> فلا يُلتفت إلى الشكوك الكثيرة، ولا إلى الشك بعد الفراغ من العبادة.", "<b>الشك في العبادة بعد الفراغ منها</b> لا يُلتفت إليه غالباً، إلا إذا تيقّن الخلل.", "<b>لها مستثنيات</b> قليلة ذكرها الفقهاء، كمن شكّ هل مسح في الحضر أو في السفر فيأخذ بالأحوط عند بعضهم.", "<b>من فروعها المهمة:</b> «الأصل بقاء ما كان على ما كان»، و«الأصل براءة الذمة»، و«الأصل في الأشياء الإباحة»."]}, {"id": "r6", "major": false, "title": "الأصل بقاء ما كان على ما كان", "meaning": "ويُسمّى «الاستصحاب»: أي أن ما ثبت في زمن يُحكم ببقائه واستمراره حتى يقوم دليل على تغيّره.", "quran": [["﴿وَمَا كَانَ اللَّهُ لِيُضِلَّ قَوْمًا بَعْدَ إِذْ هَدَاهُمْ حَتَّىٰ يُبَيِّنَ لَهُم مَّا يَتَّقُونَ﴾", "التوبة: 115"]], "sunnah": [["«لا ينصرف حتى يسمع صوتاً أو يجد ريحاً»", "البخاري 137، مسلم 361"]], "examples": ["المفقود يُحكم بحياته حتى يثبت موته أو تمضي المدة التي يحددها القاضي.", "من ثبت عليه دين ثم ادّعى سداده، فالأصل بقاء الدين حتى يُثبت السداد.", "الماء الذي عُلمت طهارته يبقى طاهراً حتى تُتيقّن نجاسته."], "notes": ["الاستصحاب من أضعف الأدلة، فيُعمل به عند عدم الدليل الناقل فقط.", "يُقال عند الفقهاء: الاستصحاب يصلح للدفع لا للاستحقاق عند الحنفية."]}, {"id": "r7", "major": false, "title": "الأصل براءة الذمة", "meaning": "الإنسان بريء الذمة من الحقوق والالتزامات والتكاليف حتى يثبت خلاف ذلك بدليل. فمن ادّعى شغل ذمة غيره فعليه البيّنة.", "quran": [["﴿وَمَا كُنَّا مُعَذِّبِينَ حَتَّىٰ نَبْعَثَ رَسُولًا﴾", "الإسراء: 15"]], "sunnah": [["قوله ﷺ: «لو يُعطى الناس بدعواهم لادّعى رجالٌ أموال قومٍ ودماءهم، ولكن اليمين على المدّعى عليه»", "البخاري 4552، مسلم 1711"]], "examples": ["المتهم بريء حتى تثبت إدانته.", "من ادّعى على غيره ديناً ولا بيّنة له، فالقول قول المنكر مع يمينه.", "لا يجب على المكلّف عبادة إلا بدليل شرعي."], "notes": ["القاعدة أصل في باب القضاء والدعاوى، ومنها تفرّعت قاعدة «البيّنة على المدعي».", "إذا ثبت شغل الذمة بيقين لم تبرأ إلا بيقين."]}, {"id": "r8", "major": false, "title": "الأصل في الأشياء الإباحة", "meaning": "الأصل في الأعيان (المطعومات والملبوسات والأشياء) والعادات والمعاملات الحِلّ والإباحة، حتى يدل دليل على التحريم. فالمحرّم محصور مفصّل، والحلال واسع.", "quran": [["﴿هُوَ الَّذِي خَلَقَ لَكُم مَّا فِي الْأَرْضِ جَمِيعًا﴾", "البقرة: 29"], ["﴿وَقَدْ فَصَّلَ لَكُم مَّا حَرَّمَ عَلَيْكُمْ﴾", "الأنعام: 119"], ["﴿قُلْ مَنْ حَرَّمَ زِينَةَ اللَّهِ الَّتِي أَخْرَجَ لِعِبَادِهِ وَالطَّيِّبَاتِ مِنَ الرِّزْقِ﴾", "الأعراف: 32"]], "sunnah": [["قوله ﷺ: «إن أعظم المسلمين جُرماً من سأل عن شيء لم يُحرَّم فحُرِّم من أجل مسألته»", "البخاري 7289، مسلم 2358"]], "examples": ["الأطعمة والأشربة الجديدة حلال ما لم تشتمل على محرّم أو ضرر.", "الوسائل الحديثة (السيارات، الهواتف، الحاسوب) مباحة في الأصل.", "العقود المستحدثة في المعاملات جائزة ما لم تشتمل على ربا أو غرر أو ظلم."], "notes": ["هذا الأصل في العادات والمعاملات والأعيان، <b>أما العبادات فالأصل فيها المنع</b> حتى يرد الدليل.", "استثنى العلماء أموراً الأصل فيها التحريم احتياطاً، كالأبضاع (الفروج) واللحوم حتى تُعلم الذكاة الشرعية."]}, {"id": "r9", "major": false, "title": "الأصل في العبادات التوقيف (المنع)", "meaning": "لا يجوز التعبّد لله إلا بما شرعه في كتابه أو على لسان رسوله ﷺ. فلا تُشرع عبادة، ولا صفة أو عدد أو وقت مخصوص لها، إلا بدليل.", "quran": [["﴿أَمْ لَهُمْ شُرَكَاءُ شَرَعُوا لَهُم مِّنَ الدِّينِ مَا لَمْ يَأْذَن بِهِ اللَّهُ﴾", "الشورى: 21"], ["﴿الْيَوْمَ أَكْمَلْتُ لَكُمْ دِينَكُمْ﴾", "المائدة: 3"]], "sunnah": [["قوله ﷺ: «من أحدث في أمرنا هذا ما ليس منه فهو رَدّ»", "البخاري 2697، مسلم 1718"], ["وفي رواية: «من عمل عملاً ليس عليه أمرنا فهو رَدّ»", "مسلم 1718"]], "examples": ["لا يجوز إحداث صلاة بعدد ركعات أو هيئة لم ترد.", "لا يجوز تخصيص يوم أو ليلة بعبادة معيّنة دون دليل.", "لا يجوز الزيادة في عدد مرات غسل أعضاء الوضوء على ثلاث تعبّداً."], "notes": ["الفرق بين <b>العبادة</b> (مقصودة لذاتها فيُشترط لها الدليل) و<b>الوسيلة</b> إليها (كمكبّرات الصوت والمصاحف المطبوعة) فتدخل في باب الإباحة.", "<b>الاختلاف بين العلماء</b> في تفاصيل بعض المسائل (كالبدعة الإضافية) معروف، فينبغي التأنّي والرجوع لأهل العلم."]}, {"id": "r10", "major": false, "title": "الأصل في الصفات العارضة العدم", "meaning": "الصفات الطارئة التي ليست من طبيعة الشيء (كالعيب في المبيع، والربح في المضاربة) الأصل عدمها حتى تثبت. أما الصفات الأصلية فالأصل وجودها.", "quran": [], "sunnah": [["«لو يُعطى الناس بدعواهم ... ولكن اليمين على المدّعى عليه»", "البخاري 4552، مسلم 1711"]], "examples": ["إذا اختلف ربّ المال والمضارب في حصول الربح، فالقول قول المضارب في عدمه، لأن الربح صفة عارضة.", "إذا ادّعى المشتري وجود عيب في المبيع وأنكره البائع، فالأصل السلامة حتى يُثبت المشتري العيب.", "من ادّعى أنه أدّى الأمانة إلى غير صاحبها بإذنه، فالأصل عدم الإذن."], "notes": ["القاعدة فرع عن «اليقين لا يزول بالشك»، وتُستعمل كثيراً في باب الدعاوى."]}]}, {"cat": {"id": 3, "title": "القاعدة الكبرى الثالثة: المشقة تجلب التيسير", "short": "التيسير ورفع الحرج"}, "rules": [{"id": "r11", "major": true, "title": "المشقة تجلب التيسير", "meaning": "الأحكام التي ينشأ عنها حرج ومشقة زائدة على المعتاد في نفس المكلّف أو بدنه أو ماله، تخففها الشريعة بما يقع تحت قدرته دون عسر. والمشقة المعتبرة هي الخارجة عن المعتاد، أما المشقة الملازمة للتكاليف عادةً (كمشقة البرد في الوضوء والجوع في الصوم) فلا تُسقطها.", "quran": [["﴿يُرِيدُ اللَّهُ بِكُمُ الْيُسْرَ وَلَا يُرِيدُ بِكُمُ الْعُسْرَ﴾", "البقرة: 185"], ["﴿وَمَا جَعَلَ عَلَيْكُمْ فِي الدِّينِ مِنْ حَرَجٍ﴾", "الحج: 78"], ["﴿يُرِيدُ اللَّهُ أَن يُخَفِّفَ عَنكُمْ ۚ وَخُلِقَ الْإِنسَانُ ضَعِيفًا﴾", "النساء: 28"]], "sunnah": [["قوله ﷺ: «إن الدين يُسر، ولن يُشادّ الدينَ أحدٌ إلا غلبه»", "البخاري 39"], ["قوله ﷺ: «يسِّروا ولا تعسِّروا، وبشِّروا ولا تنفِّروا»", "البخاري 69، مسلم 1734"], ["قول عائشة رضي الله عنها: «ما خُيِّر رسول الله ﷺ بين أمرين إلا أخذ أيسرهما ما لم يكن إثماً»", "البخاري 3560، مسلم 2327"], ["قوله ﷺ: «لولا أن أشقّ على أمتي لأمرتهم بالسواك مع كل صلاة»", "البخاري 887، مسلم 252"]], "examples": ["رخص السفر: قصر الصلاة الرباعية، والجمع، والفطر في رمضان، والمسح على الخفين ثلاثة أيام.", "رخص المرض: الصلاة قاعداً، والتيمم عند الضرر من الماء، والفطر في رمضان.", "الجمع بين الصلاتين للمطر والوحل عند جمع من العلماء.", "العفو عن يسير النجاسات التي يشقّ التحرّز منها.", "صحة صلاة الخوف على صفاتها الواردة."], "notes": ["<b>أسباب التخفيف السبعة</b> عند الفقهاء: السفر، والمرض، والإكراه، والنسيان، والجهل، والعسر وعموم البلوى، والنقص (كالصغر والجنون).", "<b>المشقة المعتادة لا تُسقط التكليف،</b> لأن التكاليف كلها لا تخلو من كلفة.", "<b>التيسير مقيّد بالشرع:</b> ليس معناه اتباع الأهواء أو تتبّع رخص المذاهب والأقوال الشاذة.", "<b>الرخصة لها ضوابط:</b> فلا تُتجاوز، ولا يُقاس عليها دائماً، وبعضها يزول بزوال سببه.", "<b>من فروعها:</b> «الضرورات تبيح المحظورات»، «الضرورة تقدّر بقدرها»، «الحاجة تنزل منزلة الضرورة»، «إذا ضاق الأمر اتسع»."]}, {"id": "r12", "major": false, "title": "الضرورات تبيح المحظورات", "meaning": "الضرورة هي الحالة التي يُخشى فيها الهلاك أو تلف عضو أو ضرر شديد على النفس أو العرض أو العقل أو المال. فإذا وقعت أُبيح للمضطر ما كان محرّماً عليه بقدر ما يدفع عنه الضرر.", "quran": [["﴿وَقَدْ فَصَّلَ لَكُم مَّا حَرَّمَ عَلَيْكُمْ إِلَّا مَا اضْطُرِرْتُمْ إِلَيْهِ﴾", "الأنعام: 119"], ["﴿فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَلَا إِثْمَ عَلَيْهِ﴾", "البقرة: 173"], ["﴿إِلَّا مَنْ أُكْرِهَ وَقَلْبُهُ مُطْمَئِنٌّ بِالْإِيمَانِ﴾", "النحل: 106"]], "sunnah": [["رخّص النبي ﷺ لعبد الرحمن بن عوف والزبير في قميص الحرير لحِكّة كانت بهما", "البخاري 2919، مسلم 2076"]], "examples": ["أكل الميتة للمضطر جوعاً.", "إساغة اللقمة بالخمر لمن غصّ ولم يجد غيرها.", "التلفظ بكلمة الكفر عند الإكراه الملجئ مع اطمئنان القلب.", "إتلاف مال الغير لدفع الهلاك، مع الضمان."], "notes": ["<b>شروط الضرورة:</b> أن تكون واقعة لا متوقعة، وألا يوجد بديل مباح، وأن يُقتصر على قدر الحاجة.", "لا تُبيح الضرورة قتل المعصوم ولا الزنا، لأن مفسدتهما أعظم أو مساوية.", "هذه القاعدة وقاعدة «لا حرام مع الضرورة» بمعنى واحد."]}, {"id": "r13", "major": false, "title": "الضرورة تُقدَّر بقدرها", "meaning": "ما أُبيح للضرورة يُباح بالقدر الذي يدفعها فقط، فلا يجوز التوسع فيه ولا الاستمرار عليه بعد زوالها. وهي قيد لقاعدة «الضرورات تبيح المحظورات».", "quran": [["﴿فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ﴾، قال جمع من المفسرين: غير متجاوز قدر الحاجة", "البقرة: 173"], ["﴿فَمَنِ اضْطُرَّ فِي مَخْمَصَةٍ غَيْرَ مُتَجَانِفٍ لِّإِثْمٍ﴾", "المائدة: 3"]], "sunnah": [], "examples": ["المضطر يأكل من الميتة ما يسدّ رمقه.", "الطبيب ينظر من العورة موضع الحاجة فقط.", "الشاهد عند الحاجة يُنظر إلى وجه المرأة للشهادة بقدر ما يعرفها."], "notes": ["اختلف العلماء: هل للمضطر أن يشبع أو يتزود من الميتة؟ على أقوال.", "قريب منها قاعدة «ما أُبيح للضرورة يُقدَّر بقدرها»."]}, {"id": "r14", "major": false, "title": "لا واجب مع العجز ولا حرام مع الضرورة", "meaning": "من عجز عن واجب سقط عنه ما عجز عنه، ومن اضطر إلى محرّم أُبيح له بقدر الضرورة. والتكليف مشروط بالقدرة.", "quran": [["﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ﴾", "التغابن: 16"], ["﴿لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا﴾", "البقرة: 286"], ["﴿وَلِلَّهِ عَلَى النَّاسِ حِجُّ الْبَيْتِ مَنِ اسْتَطَاعَ إِلَيْهِ سَبِيلًا﴾", "آل عمران: 97"]], "sunnah": [["«إذا أمرتكم بأمر فأتوا منه ما استطعتم»", "البخاري 7288، مسلم 1337"], ["«صلِّ قائماً، فإن لم تستطع فقاعداً، فإن لم تستطع فعلى جنب»", "البخاري 1117"]], "examples": ["المريض يصلي قاعداً إذا عجز عن القيام.", "من عدم الماء أو عجز عن استعماله تيمّم.", "الكبير العاجز عن الصوم عجزاً دائماً يُطعم عن كل يوم مسكيناً.", "من لا يجد ما يستر به عورته يصلي على حاله."], "notes": ["العجز عن البعض لا يُسقط الكل (الميسور لا يسقط بالمعسور).", "السقوط قد يكون إلى بدل كالتيمم والفدية والقضاء.", "لا يجوز التحايل بإيقاع النفس في العجز لإسقاط الواجب."]}, {"id": "r15", "major": false, "title": "الحاجة تنزل منزلة الضرورة عامةً كانت أو خاصة", "meaning": "الحاجة: ما يترتب على فقده حرج ومشقة شديدة دون أن يبلغ الهلاك. وقد تُعامَل معاملة الضرورة في إباحة بعض الممنوعات، خاصةً ما كان تحريمه تحريم وسائل لا تحريم مقاصد.", "quran": [["﴿وَمَا جَعَلَ عَلَيْكُمْ فِي الدِّينِ مِنْ حَرَجٍ﴾", "الحج: 78"]], "sunnah": [["«رخّص النبي ﷺ في العرايا أن تُباع بخرصها كيلاً»", "البخاري 2192، مسلم 1539"], ["قوله ﷺ: «من أسلف في شيء فليُسلِف في كيل معلوم ووزن معلوم إلى أجل معلوم»", "البخاري 2240، مسلم 1604"], ["قوله ﷺ للخاطب: «انظر إليها، فإنه أحرى أن يُؤدَم بينكما»", "الترمذي 1087، النسائي 3235"]], "examples": ["جواز عقد السَّلَم مع أنه بيع معدوم، لحاجة الناس إليه.", "جواز الإجارة مع أن المنفعة معدومة عند العقد.", "نظر الخاطب إلى المخطوبة.", "لبس الحرير للرجل لحاجة علاجية كالحكّة."], "notes": ["<b>الحاجة العامة:</b> ما يحتاجه عموم الناس. <b>الحاجة الخاصة:</b> ما يحتاجه فرد أو فئة.", "الحاجة لا تبيح المحرّم لذاته (كالربا الصريح والزنا)، وإنما تبيح غالباً ما حُرّم سدّاً للذريعة.", "ينبغي ضبط الحاجة بقول أهل العلم، لا بتقدير الإنسان لنفسه."]}, {"id": "r16", "major": false, "title": "ما جاز لعذر بطل بزواله", "meaning": "الرخصة التي شُرعت بسبب عذر تنتهي بانتهاء ذلك العذر، ويعود الحكم الأصلي.", "quran": [["﴿فَإِذَا اطْمَأْنَنتُمْ فَأَقِيمُوا الصَّلَاةَ﴾", "النساء: 103"], ["﴿فَإِذَا أَمِنتُمْ فَاذْكُرُوا اللَّهَ كَمَا عَلَّمَكُم﴾", "البقرة: 239"]], "sunnah": [["قوله ﷺ: «الصعيد الطيب وضوء المسلم وإن لم يجد الماء عشر سنين، فإذا وجد الماء فليُمِسَّه بشرته»", "أبو داود 332، الترمذي 124"]], "examples": ["من تيمّم لعدم الماء بطل تيمّمه إذا وجد الماء.", "المريض الذي صلّى قاعداً ثم قدر على القيام أثناء الصلاة لزمه القيام.", "إذا شُفي من يلبس الحرير لعلاج وجب عليه نزعه."], "notes": ["قريب منها: «إذا زال المانع عاد الممنوع».", "ما صحّ من العبادات حال العذر لا تجب إعادته غالباً بعد زواله."]}, {"id": "r17", "major": false, "title": "إذا ضاق الأمر اتسع", "meaning": "إذا ظهرت مشقة في أمر يُرخَّص فيه ويُوسَّع، فإذا زالت المشقة عاد الأمر إلى أصله. ويُكملها قولهم: «وإذا اتسع ضاق».", "quran": [["﴿فَإِنْ خِفْتُمْ فَرِجَالًا أَوْ رُكْبَانًا﴾", "البقرة: 239"], ["﴿فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾", "الشرح: 5-6"]], "sunnah": [["«إن الدين يُسر»", "البخاري 39"]], "examples": ["صلاة الخوف ماشياً أو راكباً إلى القبلة وغيرها.", "قبول شهادة النساء فيما لا يطّلع عليه الرجال غالباً.", "التوسع في بعض أحكام المعاملات عند عموم البلوى."], "notes": ["التوسعة مؤقتة بقيام سببها.", "هي بمعنى «المشقة تجلب التيسير»، وقد نُقلت عن الإمام الشافعي رحمه الله."]}, {"id": "r18", "major": false, "title": "الميسور لا يسقط بالمعسور", "meaning": "إذا تعذّر على المكلّف فعل المأمور به كاملاً، وقدر على بعضه، وجب عليه فعل ما يقدر عليه، ولا يسقط عنه ما يستطيعه بسبب عجزه عن الباقي.", "quran": [["﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ﴾", "التغابن: 16"]], "sunnah": [["«إذا أمرتكم بأمر فأتوا منه ما استطعتم»", "البخاري 7288، مسلم 1337"], ["«صلِّ قائماً، فإن لم تستطع فقاعداً، فإن لم تستطع فعلى جنب»", "البخاري 1117"]], "examples": ["من عجز عن القيام في الصلاة وقدر على الركوع والسجود لزمه ذلك.", "من قُطع بعض يده غسل ما بقي من محل الفرض.", "من عجز عن قراءة الفاتحة كاملة قرأ ما يحسنه منها.", "من قدر على بعض النفقة الواجبة لأهله لزمه ما قدر عليه."], "notes": ["إذا كان البعض المقدور عليه <b>ليس عبادة مستقلة</b> ولا مقصوداً في نفسه، فقد لا يلزم (كإمساك بعض يوم لمن لا يقدر على صومه).", "تُعرف هذه القاعدة أيضاً بقولهم: «ما لا يُدرك كله لا يُترك جُلّه»."]}]}, {"cat": {"id": 4, "title": "القاعدة الكبرى الرابعة: لا ضرر ولا ضرار (الضرر يُزال)", "short": "دفع الضرر"}, "rules": [{"id": "r19", "major": true, "title": "لا ضرر ولا ضرار", "meaning": "لا يجوز للإنسان أن يُلحق الضرر بنفسه ولا بغيره ابتداءً (وهو الضرر)، ولا أن يقابل الضرر بضرر على وجه المجازاة غير المشروعة (وهو الضرار). وإذا وقع الضرر وجب رفعه وإزالته، ولذلك تُصاغ أيضاً: «الضرر يُزال».", "quran": [["﴿وَلَا تُمْسِكُوهُنَّ ضِرَارًا لِّتَعْتَدُوا﴾", "البقرة: 231"], ["﴿لَا تُضَارَّ وَالِدَةٌ بِوَلَدِهَا وَلَا مَوْلُودٌ لَّهُ بِوَلَدِهِ﴾", "البقرة: 233"], ["﴿وَلَا يُضَارَّ كَاتِبٌ وَلَا شَهِيدٌ﴾", "البقرة: 282"], ["﴿مِن بَعْدِ وَصِيَّةٍ يُوصَىٰ بِهَا أَوْ دَيْنٍ غَيْرَ مُضَارٍّ﴾", "النساء: 12"]], "sunnah": [["قوله ﷺ: «لا ضرر ولا ضرار»", "ابن ماجه 2341، ومالك في الموطأ مرسلاً، وحسّنه النووي في الأربعين (32)"], ["قوله ﷺ: «من رأى منكم منكراً فليغيّره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه»", "مسلم 49"]], "examples": ["مشروعية خيار العيب في البيع لدفع الضرر عن المشتري.", "مشروعية الشفعة لدفع ضرر الشريك الجديد.", "منع الجار من إحداث ما يضرّ بجاره ضرراً بيّناً (كفتح نوافذ تكشف البيت أو إحداث روائح مؤذية).", "الحَجر على السفيه والمفلس لدفع الضرر عنه وعن الدائنين.", "وجوب الضمان على من أتلف مال غيره.", "مشروعية الطلاق والخلع لرفع الضرر عن الزوجين عند استحالة العشرة."], "notes": ["<b>الضرر يُزال بقدر الإمكان:</b> فإن أمكن إزالته كلياً فذاك، وإلا خُفّف قدر المستطاع.", "<b>الضرر لا يُزال بمثله:</b> فلا يجوز رفع ضرر بإيقاع ضرر مساوٍ أو أعظم.", "<b>القصاص والحدود والعقوبات المشروعة</b> ليست من الضرار المنهي عنه، لأنها بإذن الشرع لتحقيق مصلحة أعظم.", "<b>الضرر اليسير المعتاد</b> بين الناس (كأصوات الحياة العادية بين الجيران) لا يُمنع منه.", "<b>من فروعها:</b> «يُتحمّل الضرر الخاص لدفع الضرر العام»، «درء المفاسد مقدّم على جلب المصالح»، «يُرتكب أخف الضررين»."]}, {"id": "r20", "major": false, "title": "الضرر لا يُزال بمثله", "meaning": "لا يجوز إزالة ضرر بإحداث ضرر مثله أو أكبر منه. وهي قيد لقاعدة «الضرر يُزال»، فالإزالة تكون بما لا ضرر فيه أو بما هو أخف.", "quran": [["﴿وَلَا تَزِرُ وَازِرَةٌ وِزْرَ أُخْرَىٰ﴾", "الأنعام: 164"]], "sunnah": [["«لا ضرر ولا ضرار»", "ابن ماجه 2341"]], "examples": ["لا يجوز للمضطر أن يأخذ طعام مضطر مثله.", "لا يجوز للمكرَه على القتل أن يقتل غيره لينجو بنفسه.", "من سُرق ماله لا يجوز له أن يسرق مال شخص آخر بريء."], "notes": ["إذا كان أحد الضررين أخف جاز ارتكابه لدفع الأشد، وهي قاعدة مستقلة."]}, {"id": "r21", "major": false, "title": "يُتحمّل الضرر الخاص لدفع الضرر العام", "meaning": "إذا تعارض ضرر يقع على فرد أو فئة قليلة مع ضرر يعمّ المجتمع، قُدّم دفع الضرر العام ولو لزم منه وقوع الضرر الخاص.", "quran": [["﴿وَلَكُمْ فِي الْقِصَاصِ حَيَاةٌ يَا أُولِي الْأَلْبَابِ﴾", "البقرة: 179"]], "sunnah": [["قوله ﷺ: «لا يبع حاضرٌ لبادٍ، دعوا الناس يرزق الله بعضهم من بعض»", "مسلم 1522"]], "examples": ["هدم البيت الآيل للسقوط على المارّة ولو كره صاحبه.", "الحجر على الطبيب الجاهل والمفتي الماجن.", "نزع الملكية الخاصة للمصلحة العامة (كتوسعة طريق أو مسجد) مع التعويض العادل.", "منع الاحتكار وإجبار المحتكر على البيع بثمن المثل."], "notes": ["يجب تعويض صاحب الضرر الخاص حيث أمكن.", "تقدير المصلحة العامة يكون من أهل الاختصاص وولاة الأمر، لا بالأهواء."]}, {"id": "r22", "major": false, "title": "درء المفاسد مقدّم على جلب المصالح", "meaning": "إذا تعارضت مفسدة ومصلحة متساويتان أو كانت المفسدة أعظم، قُدّم دفع المفسدة، لأن عناية الشرع بترك المنهيات أشد من عنايته بفعل المأمورات.", "quran": [["﴿يَسْأَلُونَكَ عَنِ الْخَمْرِ وَالْمَيْسِرِ ۖ قُلْ فِيهِمَا إِثْمٌ كَبِيرٌ وَمَنَافِعُ لِلنَّاسِ وَإِثْمُهُمَا أَكْبَرُ مِن نَّفْعِهِمَا﴾", "البقرة: 219"], ["﴿وَلَا تَسُبُّوا الَّذِينَ يَدْعُونَ مِن دُونِ اللَّهِ فَيَسُبُّوا اللَّهَ عَدْوًا بِغَيْرِ عِلْمٍ﴾", "الأنعام: 108"]], "sunnah": [["قوله ﷺ: «ما نهيتكم عنه فاجتنبوه، وما أمرتكم به فأتوا منه ما استطعتم»", "البخاري 7288، مسلم 1337"], ["قوله ﷺ لعائشة: «لولا حداثة قومك بالكفر لنقضت البيت ثم لبنيته على أساس إبراهيم»", "البخاري 1586، مسلم 1333"]], "examples": ["تحريم الخمر والميسر مع ما فيهما من منافع.", "ترك النبي ﷺ إعادة بناء الكعبة خشية الفتنة.", "كراهة المبالغة في المضمضة والاستنشاق للصائم.", "منع بيع السلاح في الفتنة."], "notes": ["<b>إذا كانت المصلحة أعظم</b> من المفسدة قُدّمت المصلحة، كالكذب للإصلاح بين الناس، والجهاد مع ما فيه من إتلاف النفوس.", "الموازنة بين المصالح والمفاسد تحتاج إلى علم وفقه، وهي من أدق أبواب الفقه."]}, {"id": "r23", "major": false, "title": "إذا تعارضت مفسدتان رُوعي أعظمهما ضرراً بارتكاب أخفّهما", "meaning": "إذا لم يكن بدٌّ من الوقوع في إحدى مفسدتين، وجب اختيار أخفّهما لدفع أعظمهما. وتُعرف أيضاً بقولهم: «يُختار أهون الشرّين» و«يُرتكب أخف الضررين».", "quran": [["﴿أَمَّا السَّفِينَةُ فَكَانَتْ لِمَسَاكِينَ يَعْمَلُونَ فِي الْبَحْرِ فَأَرَدتُّ أَنْ أَعِيبَهَا وَكَانَ وَرَاءَهُم مَّلِكٌ يَأْخُذُ كُلَّ سَفِينَةٍ غَصْبًا﴾", "الكهف: 79"], ["﴿يَسْأَلُونَكَ عَنِ الشَّهْرِ الْحَرَامِ قِتَالٍ فِيهِ ۖ قُلْ قِتَالٌ فِيهِ كَبِيرٌ ۖ وَصَدٌّ عَن سَبِيلِ اللَّهِ وَكُفْرٌ بِهِ ... أَكْبَرُ عِندَ اللَّهِ﴾", "البقرة: 217"]], "sunnah": [["بال أعرابي في المسجد فقام الناس إليه، فقال ﷺ: «دعوه، وأريقوا على بوله سَجلاً من ماء»", "البخاري 220، مسلم 284"]], "examples": ["ترك الأعرابي يُتمّ بوله لأن قطعه أشد ضرراً عليه وأكثر تنجيساً للمسجد.", "شقّ بطن الميتة لإخراج الجنين الحي إذا رُجيت حياته.", "قبول النبي ﷺ شروط صلح الحديبية لمصلحة أعظم.", "الصلاة مع النجاسة أو كشف بعض العورة عند العجز، ولا تُترك الصلاة."], "notes": ["إذا تساوت المفسدتان خُيّر المكلّف أو اجتهد في الترجيح.", "قريب منها: «يُدفع أعظم الضررين بأهونهما»."]}, {"id": "r24", "major": false, "title": "الضرر يُدفع بقدر الإمكان", "meaning": "يجب دفع الضرر قبل وقوعه بكل وسيلة مشروعة ممكنة، فإن لم يمكن دفعه كلياً دُفع منه ما أمكن.", "quran": [["﴿وَأَعِدُّوا لَهُم مَّا اسْتَطَعْتُم مِّن قُوَّةٍ﴾", "الأنفال: 60"], ["﴿فَاتَّقُوا اللَّهَ مَا اسْتَطَعْتُمْ﴾", "التغابن: 16"]], "sunnah": [["«من رأى منكم منكراً فليغيّره بيده، فإن لم يستطع فبلسانه، فإن لم يستطع فبقلبه»", "مسلم 49"]], "examples": ["مشروعية الحجر الصحي عند الأوبئة.", "إعداد القوة لدفع العدو.", "مشروعية الشفعة قبل أن يتضرر الشريك من الشريك الجديد."], "notes": ["الوقاية مقدّمة على العلاج، والدفع أسهل من الرفع."]}]}, {"cat": {"id": 5, "title": "القاعدة الكبرى الخامسة: العادة محكَّمة", "short": "العرف والعادة"}, "rules": [{"id": "r25", "major": true, "title": "العادة محكَّمة", "meaning": "العادة والعرف الجاريان بين الناس يُرجع إليهما في تحديد الأحكام الشرعية التي لم يرد في الشرع ولا في اللغة تحديد لها. والعرف: ما تعارف عليه الناس واستقرّ في نفوسهم من قول أو فعل. فالشرع يُحيل إلى العرف في كثير من المقادير والصفات.", "quran": [["﴿خُذِ الْعَفْوَ وَأْمُرْ بِالْعُرْفِ وَأَعْرِضْ عَنِ الْجَاهِلِينَ﴾", "الأعراف: 199"], ["﴿وَعَاشِرُوهُنَّ بِالْمَعْرُوفِ﴾", "النساء: 19"], ["﴿وَعَلَى الْمَوْلُودِ لَهُ رِزْقُهُنَّ وَكِسْوَتُهُنَّ بِالْمَعْرُوفِ﴾", "البقرة: 233"], ["﴿وَلَهُنَّ مِثْلُ الَّذِي عَلَيْهِنَّ بِالْمَعْرُوفِ﴾", "البقرة: 228"]], "sunnah": [["قوله ﷺ لهند بنت عتبة: «خذي ما يكفيكِ وولدكِ بالمعروف»", "البخاري 5364، مسلم 1714"], ["قوله ﷺ: «المكيال مكيال أهل المدينة، والوزن وزن أهل مكة»", "أبو داود 3340، النسائي 2520"], ["قول ابن مسعود رضي الله عنه: «ما رآه المسلمون حسناً فهو عند الله حسن» (موقوف)", "أحمد 3600"]], "examples": ["تقدير النفقة الواجبة للزوجة والأولاد بحسب العرف وحال الزوج.", "تحديد ما يُعدّ «حِرزاً» في السرقة، وما يُعدّ «قبضاً» في البيع.", "أقل الحيض وأكثره ومدة النفاس عند من يرجع فيها إلى العادة.", "ما يدخل في البيع تبعاً (كمفاتيح البيت عند بيعه) يُرجع فيه إلى العرف.", "تحديد السفر الذي تُقصر فيه الصلاة عند من رجع فيه إلى العرف (كشيخ الإسلام ابن تيمية).", "ألفاظ الأيمان والوصايا والأوقاف تُحمل على عرف المتكلم."], "notes": ["<b>شروط العرف المعتبر:</b> أن يكون مطّرداً أو غالباً، وأن يكون قائماً عند إنشاء التصرف، وألا يخالف نصاً شرعياً، وألا يُصرّح المتعاقدان بخلافه.", "<b>العرف الفاسد لا عبرة به،</b> كتعارف الناس على الربا أو الاختلاط المحرم أو كشف العورات.", "<b>العرف يختلف باختلاف البلدان والأزمان،</b> فيُفتى أهل كل بلد بعرفهم فيما مرجعه العرف.", "<b>ما حدّده الشرع لا يُرجع فيه إلى العرف،</b> كنصاب الزكاة وعدد الركعات ومقادير المواريث.", "<b>قال العلماء:</b> «كل ما ورد به الشرع مطلقاً، ولا ضابط له فيه ولا في اللغة، يُرجع فيه إلى العرف»."]}, {"id": "r26", "major": false, "title": "المعروف عرفاً كالمشروط شرطاً", "meaning": "ما تعارف عليه الناس في معاملاتهم يُعدّ ملزماً كالشرط المصرّح به في العقد، وإن لم يُذكر لفظاً. ومثلها: «المعروف بين التجار كالمشروط بينهم».", "quran": [["﴿لِيُنفِقْ ذُو سَعَةٍ مِّن سَعَتِهِ﴾", "الطلاق: 7"]], "sunnah": [["«خذي ما يكفيكِ وولدكِ بالمعروف»", "البخاري 5364، مسلم 1714"]], "examples": ["من استأجر عاملاً دون تحديد ساعات العمل، رُجع إلى المعتاد في تلك المهنة.", "إذا جرى العرف بأن البائع يتحمّل التوصيل، لزمه ولو لم يُشترط.", "إذا تعارف الناس على تقسيط المهر (معجّل ومؤجّل) حُمل العقد المطلق عليه.", "من دفع ثوبه لخيّاط معروف بالأجرة استحق الأجرة ولو لم يتفقا عليها."], "notes": ["إذا صرّح المتعاقدان بخلاف العرف قُدّم التصريح، لأن «الصريح مقدّم على الدلالة».", "العرف المعتبر هو العرف السابق أو المقارن للعقد، لا الطارئ بعده."]}, {"id": "r27", "major": false, "title": "لا يُنكَر تغيّر الأحكام بتغيّر الأزمان", "meaning": "الأحكام المبنيّة على العرف والعادة والمصلحة قد تتغيّر بتغيّر أعراف الناس وأحوالهم وأزمانهم. أما الأحكام الثابتة بالنص القطعي فلا تتغيّر.", "quran": [["﴿وَأْمُرْ بِالْعُرْفِ﴾", "الأعراف: 199"]], "sunnah": [["«خذي ما يكفيكِ وولدكِ بالمعروف»، فالكفاية تختلف باختلاف الأزمان والأحوال", "البخاري 5364، مسلم 1714"], ["أمر عثمان رضي الله عنه في خلافته بتعريف ضوالّ الإبل ثم بيعها وحفظ ثمنها لصاحبها، لتغيّر أحوال الناس", "مالك في الموطأ"]], "examples": ["تقدير النفقة والمهر يختلف من زمن لآخر.", "التقاط ضالّة الإبل منعه النبي ﷺ، وأجاز عثمان بيعها وحفظ ثمنها لمّا فسدت الذمم.", "وسائل الإثبات والقبض والتوثيق تتطور (كالتوقيع الإلكتروني والتحويل البنكي)."], "notes": ["<b>تنبيه مهم:</b> المتغيّر هو الفتوى في تطبيق الحكم على الواقع، لا أصل الحكم الشرعي. فالعبادات والمقدّرات والمحرّمات القطعية ثابتة لا تتغير.", "استُغلّت هذه القاعدة أحياناً لتغيير الثوابت، وهذا خطأ منهجي."]}, {"id": "r28", "major": false, "title": "استعمال الناس حجة يجب العمل بها", "meaning": "ما جرى عليه استعمال الناس في ألفاظهم ومعاملاتهم يُحتجّ به ويُحمل عليه كلامهم وتصرفاتهم، ما لم يخالف الشرع.", "quran": [["﴿وَمَا أَرْسَلْنَا مِن رَّسُولٍ إِلَّا بِلِسَانِ قَوْمِهِ لِيُبَيِّنَ لَهُمْ﴾", "إبراهيم: 4"]], "sunnah": [["«المكيال مكيال أهل المدينة، والوزن وزن أهل مكة»", "أبو داود 3340، النسائي 2520"]], "examples": ["من حلف ألا يأكل «لحماً» لم يحنث بأكل السمك عند جمع من الفقهاء، لأن السمك لا يُسمّى لحماً عند الإطلاق في عرف الناس (وفي المسألة خلاف).", "من حلف ألا يدخل «بيتاً» لم يحنث بدخول المسجد في العرف.", "إطلاق «الدرهم» أو «الدينار» في العقد يُحمل على العملة الجارية في البلد."], "notes": ["يُقدّم العرف في تفسير الألفاظ على المعنى اللغوي عند كثير من الفقهاء في الأيمان والمعاملات."]}]}, {"cat": {"id": 6, "title": "قواعد فقهية أخرى مشهورة", "short": "قواعد أخرى"}, "rules": [{"id": "r29", "major": false, "title": "ما لا يتم الواجب إلا به فهو واجب", "meaning": "إذا توقّف أداء الواجب على فعل شيء آخر يقدر عليه المكلّف، صار ذلك الشيء واجباً أيضاً، لأنه وسيلة لا يتحقق الواجب بدونها.", "quran": [["﴿يَا أَيُّهَا الَّذِينَ آمَنُوا إِذَا نُودِيَ لِلصَّلَاةِ مِن يَوْمِ الْجُمُعَةِ فَاسْعَوْا إِلَىٰ ذِكْرِ اللَّهِ﴾", "الجمعة: 9"], ["﴿وَأَعِدُّوا لَهُم مَّا اسْتَطَعْتُم مِّن قُوَّةٍ﴾", "الأنفال: 60"]], "sunnah": [], "examples": ["طلب الماء للوضوء عند دخول الوقت واجب.", "السعي إلى صلاة الجمعة واجب.", "تعلّم أحكام الصلاة والصيام واجب على كل مكلّف.", "غسل جزء من الرأس لتحقيق استيعاب الوجه في الوضوء."], "notes": ["القاعدة فيما كان <b>في قدرة المكلّف</b>. أما ما ليس في قدرته (كدخول الوقت، وبلوغ النصاب) فلا يجب تحصيله، وهو شرط وجوب لا شرط أداء.", "قريب منها: «ما لا يتم ترك الحرام إلا بتركه فتركه واجب»."]}, {"id": "r30", "major": false, "title": "الوسائل لها أحكام المقاصد", "meaning": "الطرق والأسباب المؤدية إلى الأحكام تأخذ حكم ما تؤدي إليه: فوسيلة الواجب واجبة، ووسيلة المحرّم محرّمة، ووسيلة المستحب مستحبة، ووسيلة المكروه مكروهة.", "quran": [["﴿ذَٰلِكَ بِأَنَّهُمْ لَا يُصِيبُهُمْ ظَمَأٌ وَلَا نَصَبٌ وَلَا مَخْمَصَةٌ فِي سَبِيلِ اللَّهِ ... إِلَّا كُتِبَ لَهُم بِهِ عَمَلٌ صَالِحٌ﴾", "التوبة: 120"], ["﴿وَلَا تَقْرَبُوا الزِّنَىٰ﴾", "الإسراء: 32"]], "sunnah": [["قوله ﷺ: «من سلك طريقاً يلتمس فيه علماً سهّل الله له به طريقاً إلى الجنة»", "مسلم 2699"]], "examples": ["المشي إلى المسجد يُؤجر عليه لأنه وسيلة إلى الصلاة.", "بيع العنب لمن يُعلم أنه يتخذه خمراً محرّم.", "الخلوة بالأجنبية محرّمة لأنها وسيلة إلى الفاحشة.", "تعلّم اللغة العربية لفهم القرآن من الوسائل المحمودة."], "notes": ["تُقاس درجة الوسيلة غالباً بدرجة المقصد، ووسيلة الأعلى أعلى.", "قد تكون الوسيلة محرّمة في نفسها فلا تُباح لأجل مقصد حسن: «الغاية لا تبرّر الوسيلة»."]}, {"id": "r31", "major": false, "title": "سدّ الذرائع", "meaning": "منع الأفعال المباحة في أصلها إذا كانت تُفضي غالباً أو كثيراً إلى محرّم أو مفسدة راجحة، حسماً لمادة الفساد.", "quran": [["﴿وَلَا تَسُبُّوا الَّذِينَ يَدْعُونَ مِن دُونِ اللَّهِ فَيَسُبُّوا اللَّهَ عَدْوًا بِغَيْرِ عِلْمٍ﴾", "الأنعام: 108"], ["﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَقُولُوا رَاعِنَا وَقُولُوا انظُرْنَا﴾", "البقرة: 104"], ["﴿وَلَا يَضْرِبْنَ بِأَرْجُلِهِنَّ لِيُعْلَمَ مَا يُخْفِينَ مِن زِينَتِهِنَّ﴾", "النور: 31"]], "sunnah": [["قوله ﷺ: «إن من أكبر الكبائر أن يلعن الرجل والديه» قيل: وكيف يلعن الرجل والديه؟ قال: «يسبّ الرجلُ أبا الرجل فيسبّ أباه، ويسبّ أمه فيسبّ أمه»", "البخاري 5973، مسلم 90"]], "examples": ["تحريم الخلوة بالأجنبية.", "منع بيع السلاح في الفتنة.", "تحريم بيوع العينة لأنها ذريعة إلى الربا.", "النهي عن البناء على القبور سدّاً لذريعة الغلو."], "notes": ["الذريعة ثلاثة أنواع: ما يُفضي إلى المفسدة قطعاً فيُمنع اتفاقاً، وما يُفضي إليها نادراً فلا يُمنع اتفاقاً، وما يُفضي إليها غالباً أو كثيراً ففيه الخلاف، والجمهور على منعه.", "أكثر من توسّع فيها المالكية والحنابلة.", "<b>فتح الذرائع:</b> كما تُسدّ ذرائع الفساد تُفتح ذرائع الخير."]}, {"id": "r32", "major": false, "title": "إعمال الكلام أولى من إهماله", "meaning": "إذا احتمل كلام المكلّف معنى صحيحاً يُعمل به، وجب حمله عليه، ولا يُلغى ما أمكن إعماله، لأن كلام العاقل يُصان عن اللغو. فإن تعذّرت الحقيقة حُمل على المجاز.", "quran": [["﴿أَفَلَا يَتَدَبَّرُونَ الْقُرْآنَ﴾", "النساء: 82"]], "sunnah": [], "examples": ["من أوصى «لأولاده» وليس له إلا أحفاد، حُملت الوصية على الأحفاد.", "من وقف على «ذريته» دخل فيها أولاده وأولاد أولاده.", "إذا تعارض لفظان في عقد، وأمكن الجمع بينهما، جُمع ولم يُلغَ أحدهما."], "notes": ["دليلها استقرائي ولغوي، ومن فروعها: «إذا تعذّرت الحقيقة يُصار إلى المجاز» و«إذا تعذّر إعمال الكلام يُهمل».", "قريبة منها في أصول التفسير: «التأسيس أولى من التأكيد»."]}, {"id": "r33", "major": false, "title": "التابع تابع", "meaning": "ما كان تابعاً لغيره في الوجود يأخذ حكم متبوعه ولا يُفرد بحكم مستقل. ومن فروعها: «التابع لا يُفرد بالحكم»، «يُغتفر في التوابع ما لا يُغتفر في غيرها».", "quran": [], "sunnah": [["قوله ﷺ: «ذكاة الجنين ذكاة أمه»", "أبو داود 2828، الترمذي 1476"], ["قوله ﷺ: «من باع نخلاً قد أُبّرت فثمرتها للبائع إلا أن يشترط المبتاع»", "البخاري 2204، مسلم 1543"]], "examples": ["الجنين في بطن الشاة المذكّاة حلال تبعاً لأمه.", "بيع البيت يشمل أبوابه ونوافذه وما ثُبّت فيه تبعاً.", "يصح بيع الحامل مع حملها وإن لم يصح بيع الحمل وحده.", "يصح بيع الشجر مع ثمره الذي لم يبد صلاحه تبعاً."], "notes": ["إذا انفصل التابع عن متبوعه أو صار مقصوداً استقلّ بحكمه.", "للمتعاقدين أن يشترطا خلاف التبعية كما في حديث النخل المؤبّر."]}, {"id": "r34", "major": false, "title": "الخراج بالضمان", "meaning": "من كان ضامناً لشيء لو تلف في يده، فله غلّته ومنافعه في مقابل ذلك الضمان. والخراج: ما يخرج من الشيء من غلّة ومنفعة.", "quran": [], "sunnah": [["قوله ﷺ: «الخراج بالضمان»، قاله ﷺ في رجل اشترى عبداً فاستغلّه ثم وجد به عيباً فردّه", "أبو داود 3508، الترمذي 1285 وقال: حسن صحيح، النسائي 4490، ابن ماجه 2243"]], "examples": ["من اشترى سيارة وأجّرها مدة ثم ظهر فيها عيب فردّها، فالأجرة له لأنها كانت في ضمانه.", "من اشترى بقرة فحلبها ثم ردّها بعيب قديم، فاللبن له (مع مراعاة حكم المصرّاة الخاص).", "غلّة المبيع بعد القبض للمشتري لأنه يتحمّل تلفه."], "notes": ["لا تشمل الغاصب عند كثير من العلماء، لأنه ضامن بتعدّيه لا بسبب مشروع.", "هي والقاعدة التالية «الغُنم بالغُرم» وجهان لمعنى واحد."]}, {"id": "r35", "major": false, "title": "الغُنم بالغُرم", "meaning": "من ينال نفع الشيء يتحمّل ما يترتب عليه من ضرر وتكاليف. فكما أن له الربح، عليه الخسارة. وهي أساس العدل في المعاملات والشركات.", "quran": [["﴿لَهَا مَا كَسَبَتْ وَعَلَيْهَا مَا اكْتَسَبَتْ﴾", "البقرة: 286"]], "sunnah": [["«الخراج بالضمان»", "أبو داود 3508، الترمذي 1285"]], "examples": ["الشركاء يتقاسمون الربح والخسارة بحسب رأس المال.", "نفقة الدار المشتركة على الشركاء بقدر حصصهم.", "نفقة ردّ العارية على المستعير لأنه المنتفع بها.", "الوارث يرث المال، ويُقضى الدين من التركة قبل القسمة."], "notes": ["من أسس التمويل الإسلامي: لا ربح مضمون بلا تحمّل مخاطرة، ولذلك مُنع ضمان رأس المال والربح في المضاربة."]}, {"id": "r36", "major": false, "title": "البيّنة على المدّعي واليمين على من أنكر", "meaning": "من ادّعى حقاً على غيره يُطالب بإثباته بالبيّنة (الشهود أو ما يقوم مقامها)، فإن عجز حلف المدّعى عليه المنكر وبرئ.", "quran": [["﴿وَاسْتَشْهِدُوا شَهِيدَيْنِ مِن رِّجَالِكُمْ﴾", "البقرة: 282"]], "sunnah": [["«لو يُعطى الناس بدعواهم لادّعى رجالٌ أموال قومٍ ودماءهم، ولكن اليمين على المدّعى عليه»", "البخاري 4552، مسلم 1711"], ["وفي لفظ: «البيّنة على المدّعي، واليمين على من أنكر»", "البيهقي في السنن الكبرى 10/252"], ["قوله ﷺ للأشعث بن قيس: «شاهداك أو يمينه»", "البخاري 2669، مسلم 138"]], "examples": ["من ادّعى أن له على آخر ألف يورو يُطالب بالبيّنة، وإلا حلف المنكر.", "إذا اختلف البائع والمشتري في الثمن ولا بيّنة، تحالفا وفُسخ البيع على تفصيل.", "المودَع إذا ادّعى ردّ الوديعة فالقول قوله مع يمينه لأنه أمين."], "notes": ["البيّنة كل ما يُبيّن الحق ويظهره، ولا تقتصر على الشهود عند المحققين (كابن القيم)، فتشمل القرائن القوية والوسائل الحديثة.", "تُعلم هذه القاعدة من قاعدة «الأصل براءة الذمة»."]}, {"id": "r37", "major": false, "title": "الاجتهاد لا يُنقض بالاجتهاد", "meaning": "إذا حكم القاضي أو المجتهد باجتهاد في مسألة اجتهادية، ثم تغيّر اجتهاده، لا يُنقض الحكم الأول، ويعمل بالثاني فيما يُستقبل، حفظاً لاستقرار الأحكام.", "quran": [], "sunnah": [["قوله ﷺ: «إذا حكم الحاكم فاجتهد ثم أصاب فله أجران، وإذا حكم فاجتهد ثم أخطأ فله أجر»", "البخاري 7352، مسلم 1716"], ["قول عمر رضي الله عنه لمّا قضى في المسألة المشتركة بخلاف قضائه الأول: «تلك على ما قضينا، وهذه على ما نقضي»", "الدارمي، البيهقي"]], "examples": ["من صلّى إلى جهة باجتهاد ثم تغيّر اجتهاده في الصلاة التالية، صحّت الأولى وعمل بالثاني.", "إذا حكم القاضي في مسألة خلافية ثم جاء قاضٍ آخر يرى غير رأيه، لم ينقض حكمه."], "notes": ["يُنقض الحكم إذا خالف نصاً صريحاً أو إجماعاً أو قياساً جلياً.", "علّتها: لو جاز نقض الاجتهاد بالاجتهاد لم يستقر حكم، ولتسلسلت النقوض."]}, {"id": "r38", "major": false, "title": "الحدود تُدرأ بالشبهات", "meaning": "العقوبات المقدّرة شرعاً (الحدود) تسقط عن المتهم إذا وُجدت شبهة معتبرة في ثبوت الجريمة أو في أركانها، احتياطاً للنفوس والأعراض.", "quran": [], "sunnah": [["قال ﷺ لماعز لمّا أقرّ بالزنا: «لعلك قبّلت أو غمزت أو نظرت»", "البخاري 6824"], ["«ادرؤوا الحدود عن المسلمين ما استطعتم» (ضعيف مرفوعاً، وصحّ معناه عن جماعة من الصحابة)", "الترمذي 1424"]], "examples": ["سقوط حد السرقة عن الأب إذا سرق من مال ابنه لشبهة الملك.", "سقوط الحد عمّن وطئ امرأة زُفّت إليه ظانّاً أنها زوجته.", "رجوع المُقرّ عن إقراره قبل إقامة الحد شبهة تُسقطه عند الجمهور."], "notes": ["الشبهة المعتبرة هي القوية الظاهرة، لا كل احتمال بعيد.", "سقوط الحد لا يعني سقوط التعزير أو الضمان أو الحقوق المالية.", "القاعدة مُجمع على العمل بها في الجملة وإن ضُعّف الحديث المرفوع."]}, {"id": "r39", "major": false, "title": "لا اجتهاد مع النص", "meaning": "إذا ورد نص صحيح صريح في مسألة من الكتاب أو السنة أو الإجماع، فلا مجال للاجتهاد بالرأي في مخالفته. وإنما يكون الاجتهاد في فهم النص وتطبيقه، أو فيما لا نص فيه.", "quran": [["﴿وَمَا كَانَ لِمُؤْمِنٍ وَلَا مُؤْمِنَةٍ إِذَا قَضَى اللَّهُ وَرَسُولُهُ أَمْرًا أَن يَكُونَ لَهُمُ الْخِيَرَةُ مِنْ أَمْرِهِمْ﴾", "الأحزاب: 36"], ["﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تُقَدِّمُوا بَيْنَ يَدَيِ اللَّهِ وَرَسُولِهِ﴾", "الحجرات: 1"]], "sunnah": [], "examples": ["لا يجوز الاجتهاد في تغيير أنصبة المواريث المنصوصة.", "لا يجوز الاجتهاد في إباحة الربا بحجة المصلحة.", "عدد ركعات الصلوات ثابت بالنص لا مجال للرأي فيه."], "notes": ["المراد <b>النص القطعي الدلالة</b>. أما ما يحتمل أكثر من معنى فالاجتهاد في فهمه مشروع.", "الاجتهاد في تحقيق المناط (تطبيق الحكم على الواقعة) لا يُعدّ اجتهاداً مع النص."]}, {"id": "r40", "major": false, "title": "من استعجل الشيء قبل أوانه عوقب بحرمانه", "meaning": "من تعجّل الحصول على شيء بطريق غير مشروع قبل أوانه، عُومل بنقيض قصده فحُرم منه، سداً للذرائع ومنعاً للتحايل.", "quran": [["﴿إِنَّا بَلَوْنَاهُمْ كَمَا بَلَوْنَا أَصْحَابَ الْجَنَّةِ إِذْ أَقْسَمُوا لَيَصْرِمُنَّهَا مُصْبِحِينَ﴾", "القلم: 17"]], "sunnah": [["قوله ﷺ: «القاتل لا يرث»", "الترمذي 2109، ابن ماجه 2645"]], "examples": ["الوارث إذا قتل مورّثه حُرم من الميراث.", "الموصى له إذا قتل الموصي بطلت وصيته عند جمع من العلماء.", "من طلّق زوجته في مرض الموت فراراً من إرثها ورثته عند جمهور العلماء (معاملةً بنقيض القصد)."], "notes": ["يعبّر عنها بعضهم بقاعدة «المعاملة بنقيض القصد الفاسد».", "لها مستثنيات ذكرها الفقهاء، فليست مطّردة في كل الفروع."]}, {"id": "r41", "major": false, "title": "الساقط لا يعود", "meaning": "الحق الذي أسقطه صاحبه بإرادته، وكان قابلاً للإسقاط، ينتهي ولا يعود مرة أخرى، كالمعدوم لا يرجع.", "quran": [["﴿وَأَن تَصَدَّقُوا خَيْرٌ لَّكُمْ﴾ في إسقاط الدين عن المعسر", "البقرة: 280"]], "sunnah": [], "examples": ["من أبرأ مدينه من الدين ثم ندم، لم يعد له حق المطالبة.", "من أسقط حقه في الشفعة لم يعد إليه.", "من أسقط خيار العيب بعد علمه بالعيب لم يرجع إليه."], "notes": ["دليلها استقرائي، ومعناه أن الإسقاط تصرّف منجز.", "يُستثنى ما يتجدّد سببه، كالنفقة المستقبلية للزوجة إذا أسقطتها، فلها المطالبة فيما بعد عند جمع من العلماء."]}, {"id": "r42", "major": false, "title": "تصرّف الإمام على الرعية منوط بالمصلحة", "meaning": "تصرّفات الحاكم ومن في معناه (كالقاضي والولي والوصي وناظر الوقف) في شؤون من تحت ولايته مقيّدة بتحقيق مصلحتهم، فلا تنفذ إذا كانت بخلافها.", "quran": [["﴿وَلَا تَقْرَبُوا مَالَ الْيَتِيمِ إِلَّا بِالَّتِي هِيَ أَحْسَنُ﴾", "الأنعام: 152"], ["﴿إِنَّ اللَّهَ يَأْمُرُكُمْ أَن تُؤَدُّوا الْأَمَانَاتِ إِلَىٰ أَهْلِهَا﴾", "النساء: 58"]], "sunnah": [["قوله ﷺ: «ما من عبد يسترعيه الله رعية، يموت يوم يموت وهو غاشٌّ لرعيته، إلا حرّم الله عليه الجنة»", "البخاري 7150، مسلم 142"], ["قوله ﷺ: «كلكم راعٍ وكلكم مسؤول عن رعيته»", "البخاري 893، مسلم 1829"]], "examples": ["لا يجوز للحاكم أن يولّي غير الأكفأ مع وجود الأكفأ.", "لا يجوز للوصي أن يبيع مال اليتيم بأقل من ثمن المثل.", "صرف المال العام يكون في مصالح المسلمين لا في الأهواء الشخصية.", "ناظر الوقف يتصرف بما يحقق مصلحة الوقف والموقوف عليهم."], "notes": ["أصل القاعدة من كلام الإمام الشافعي: «منزلة الإمام من الرعية منزلة الولي من اليتيم».", "تشمل كل صاحب ولاية عامة أو خاصة، كالأب ومدير المؤسسة."]}, {"id": "r43", "major": false, "title": "الرخص لا تُناط بالمعاصي", "meaning": "الرخص الشرعية تخفيف ونعمة من الله، فلا تُستباح بفعل المعصية، ولا يستفيد منها من كان سبب ترخّصه معصية.", "quran": [["﴿فَمَنِ اضْطُرَّ غَيْرَ بَاغٍ وَلَا عَادٍ فَلَا إِثْمَ عَلَيْهِ﴾", "البقرة: 173"]], "sunnah": [], "examples": ["المسافر سفر معصية لا يقصر ولا يُفطر عند الجمهور من الشافعية والحنابلة والمالكية.", "من شرب مسكراً فزال عقله لم يسقط عنه قضاء الصلوات.", "من أتلف ماءه عبثاً بعد دخول الوقت أثم وإن صحّ تيمّمه."], "notes": ["<b>الفرق المهم:</b> العاصي  كلام الإمام الشافعي رحمه الله.", "مستثنياتها كثيرة، وضابطها: وجود قرينة تدل على الرضا، أو وجوب الكلام في ذلك الموضع."]}]}];
const INTRO = "\n\n<h3>تعريف القاعدة الفقهية</h3>\n<p><b>القاعدة لغةً:</b> الأساس، وقواعد البيت أُسسه، قال تعالى: <span class=\"q\">﴿وَإِذْ يَرْفَعُ إِبْرَاهِيمُ الْقَوَاعِدَ مِنَ الْبَيْتِ﴾</span> [البقرة: 127].</p>\n<p><b>والقاعدة الفقهية اصطلاحاً:</b> حكم شرعي كلي أو أغلبي، يُتعرّف منه على أحكام جزئيات كثيرة من أبواب فقهية متعددة.</p>\n<h3>الفرق بين القاعدة الفقهية والقاعدة الأصولية</h3>\n<ul>\n<li><b>القاعدة الأصولية</b> تتعلق بالأدلة وطرق الاستنباط (مثل: الأمر يقتضي الوجوب)، وموضوعها الدليل، ويستعملها المجتهد.</li>\n<li><b>القاعدة الفقهية</b> تتعلق بأفعال المكلّفين وأحكامها (مثل: المشقة تجلب التيسير)، وموضوعها فعل المكلّف، ويستفيد منها المجتهد والمتفقه.</li>\n<li>القاعدة الأصولية كلية غالباً، أما الفقهية فأغلبية كثيراً ولها مستثنيات.</li>\n</ul>\n<h3>أهمية القواعد الفقهية</h3>\n<ul>\n<li>تجمع الفروع الكثيرة المتفرقة تحت أصل واحد، فيسهل حفظها وضبطها.</li>\n<li>تُكوّن الملَكة الفقهية، وتعين على معرفة حكم النوازل والمسائل المستجدة.</li>\n<li>تُظهر مقاصد الشريعة وحكمتها ويسرها وشمولها.</li>\n<li>قال القرافي رحمه الله: «ومن ضبط الفقه بقواعده استغنى عن حفظ أكثر الجزئيات لاندراجها في الكليات».</li>\n</ul>\n<h3>القواعد الخمس الكبرى</h3>\n<p>اتفق العلماء على أن مدار الفقه على خمس قواعد كبرى، وقد نظمها بعضهم فقال:</p>\n<blockquote>خمسٌ محرّرةٌ قواعدُ مذهبٍ ... للشافعيِّ بها تكونُ خبيرا<br>ضررٌ يُزالُ، وعادةٌ قد حُكِّمت ... وكذا المشقةُ تجلبُ التيسيرا<br>والشكُّ لا ترفعْ به متيقَّناً ... والقصدَ أخلِصْ إن أردتَ أجورا</blockquote>\n<p>وهي وإن نُسبت إلى مذهب الشافعي فإن المذاهب الأربعة متفقة على اعتبارها في الجملة.</p>\n<p>وقد رُتّب هذا المرجع على هذه القواعد الخمس وما يتفرع عنها، ثم أُتبعت بطائفة من القواعد المشهورة الأخرى. ولكل قاعدة: معناها، وأدلتها من الكتاب والسنة، وأمثلتها، ونقاط الانتباه فيها.</p>\n<h3>أهم المصادر في هذا الفن</h3>\n<ul>\n<li>«الأشباه والنظائر» لجلال الدين السيوطي.</li>\n<li>«الأشباه والنظائر» لابن نُجيم الحنفي.</li>\n<li>«الأشباه والنظائر» لتاج الدين السبكي.</li>\n<li>«قواعد الأحكام في مصالح الأنام» للعز بن عبد السلام.</li>\n<li>«الفروق» للقرافي.</li>\n<li>«القواعد النورانية» لابن تيمية، و«إعلام الموقعين» لابن القيم.</li>\n<li>«منظومة القواعد الفقهية» وشرحها للشيخ عبد الرحمن السعدي.</li>\n<li>«القواعد الفقهية الكبرى وما تفرع عنها» للدكتور صالح السدلان.</li>\n</ul>\n";
const AR = s => String(s).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
const RULES = []; CATS.forEach(c => c.rules.forEach(r => { r.cat = c.cat; r.n = RULES.length + 1; RULES.push(r); }));
const byId = Object.fromEntries(RULES.map(r => [r.id, r]));
const strip = s => s.replace(/<[^>]+>/g, '');
const norm = s => strip(s).replace(/[ً-ٰٟـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/[«»﴿﴾]/g, '').toLowerCase();
RULES.forEach(r => { r.hay = norm([r.title, r.meaning, ...r.quran.flat(), ...r.sunnah.flat(), ...r.examples, ...r.notes].join(' ')); r.hayT = norm(r.title); });

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem('qf-done') || '[]')); } catch (e) {}
const saveDone = () => { try { localStorage.setItem('qf-done', JSON.stringify([...done])); } catch (e) {} };
let filter = 'all', query = '', current = null;
const $ = id => document.getElementById(id);

function renderNav() {
  const qn = norm(query.trim());
  let html = '', any = false;
  CATS.forEach(c => {
    const items = c.rules.filter(r => (filter !== 'major' || r.major) && (filter !== 'todo' || !done.has(r.id)) && (!qn || r.hay.includes(qn)));
    if (!items.length) return; any = true;
    html += `<div class="cat"><div class="cat-h">${c.cat.short}</div>` + items.map(r =>
      `<button class="item${r.major ? ' major' : ''}" data-id="${r.id}" aria-current="${r.id === current}"><span class="n">${AR(r.n)}</span><span class="t">${r.title}</span>${done.has(r.id) ? '<span class="done">✓</span>' : ''}</button>`).join('') + '</div>';
  });
  $('nav').innerHTML = any ? html : '<div class="empty">لا توجد نتائج مطابقة. جرّب كلمة أخرى.</div>';
}

function evList(arr, cls) {
  return '<ul class="ev">' + arr.map(([t, ref]) => `<li><span class="${cls}">${t}</span><span class="ref">${ref}</span></li>`).join('') + '</ul>';
}

function showRule(id) {
  const r = byId[id]; if (!r) return showHome();
  current = id; const i = r.n - 1, prev = RULES[i - 1], next = RULES[i + 1];
  let h = `<p class="eyebrow">${r.cat.title} · القاعدة ${AR(r.n)} من ${AR(RULES.length)}</p>
  <h2 class="rule-h">${r.title}</h2>${r.major ? '<span class="major-tag">قاعدة كبرى</span>' : ''}
  <div class="actions"><button class="btn${done.has(id) ? ' on' : ''}" id="mark">${done.has(id) ? '✓ حفظتها' : 'علّمها كمحفوظة'}</button><button class="btn" id="copy">نسخ القاعدة</button><button class="btn" id="rand">قاعدة عشوائية</button></div>
  <section class="blk"><h3>المعنى</h3><p class="meaning">${r.meaning}</p></section>`;
  if (r.quran.length || r.sunnah.length) {
    h += '<section class="blk"><h3>الأدلة</h3>';
    if (r.quran.length) h += '<p class="sub-h">من الكتاب</p>' + evList(r.quran, 'q');
    if (r.sunnah.length) h += '<p class="sub-h">من السنة والآثار</p>' + evList(r.sunnah, 'h');
    h += '</section>';
  }
  h += `<section class="blk"><h3>أمثلة</h3><ul class="ex">${r.examples.map(e => `<li>${e}</li>`).join('')}</ul></section>
  <section class="blk"><h3>نقاط انتباه</h3><ol class="nt">${r.notes.map(e => `<li>${e}</li>`).join('')}</ol></section>
  <div class="pager"><button id="next" ${next ? '' : 'disabled'}><small>التالية</small>${next ? next.title : ''}</button><button id="prev" ${prev ? '' : 'disabled'}><small>السابقة</small>${prev ? prev.title : ''}</button></div>`;
  $('view').innerHTML = h; $('main').scrollTop = 0;
  $('mark').onclick = () => { done.has(id) ? done.delete(id) : done.add(id); saveDone(); showRule(id); renderNav(); };
  $('copy').onclick = () => copyText(`${r.title}\n\n${strip(r.meaning)}`);
  $('rand').onclick = randomRule;
  if (next) $('next').onclick = () => go(next.id);
  if (prev) $('prev').onclick = () => go(prev.id);
  renderNav(); closeSide();
}

function showHome() {
  current = null;
  const majors = RULES.filter(r => r.major);
  const pct = Math.round(done.size / RULES.length * 100);
  $('view').innerHTML = `<div class="hero"><p class="eyebrow">مرجع مختصر</p><h2>القواعد الفقهية الكبرى وفروعها</h2>
  <p>${AR(RULES.length)} قاعدة فقهية، لكل منها معناها وأدلتها من الكتاب والسنة وأمثلتها ونقاط الانتباه فيها. اختر قاعدة من الفهرس أو ابحث عن كلمة.</p></div>
  <div class="poem">خمسٌ محرّرةٌ قواعدُ مذهبٍ ... للشافعيِّ بها تكونُ خبيرا<br>ضررٌ يُزالُ، وعادةٌ قد حُكِّمت ... وكذا المشقةُ تجلبُ التيسيرا<br>والشكُّ لا ترفعْ به متيقَّناً ... والقصدَ أخلِصْ إن أردتَ أجورا</div>
  <h3 style="font-size:14px;color:var(--accent);margin:18px 0 0">القواعد الخمس الكبرى</h3>
  <div class="big5">${majors.map(r => `<button class="card" data-id="${r.id}"><b>${r.title}</b><span>${r.cat.short} · ${AR(CATS.find(c => c.cat.id === r.cat.id).rules.length - 1)} قواعد فرعية</span></button>`).join('')}
  <button class="card" data-id="r29"><b>قواعد أخرى مشهورة</b><span>${AR(CATS[5].rules.length)} قاعدة</span></button></div>
  <div class="progress">حفظت ${AR(done.size)} من ${AR(RULES.length)} قاعدة<div class="bar"><i style="width:${pct}%"></i></div></div>
  <div class="intro">${INTRO}</div>`;
  $('main').scrollTop = 0; renderNav();
}

function go(id) { if (location.hash !== '#' + id) location.hash = id; else route(); }
function route() { const id = location.hash.slice(1); byId[id] ? showRule(id) : showHome(); }
function randomRule() { go(RULES[Math.floor(Math.random() * RULES.length)].id); }
function toast(t) { const el = $('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 1600); }
function copyText(t) {
  navigator.clipboard?.writeText(t).then(() => toast('تم النسخ')).catch(() => toast('تعذّر النسخ، حدّد النص يدوياً'));
}
function closeSide() { $('side').classList.remove('open'); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-id]'); if (b) go(b.dataset.id);
});
$('home-link').onclick = () => { if (location.hash) location.hash = ''; showHome(); closeSide(); };
$('home-link').onkeydown = e => { if (e.key === 'Enter') $('home-link').click(); };
$('menu').onclick = () => $('side').classList.add('open');
$('close').onclick = closeSide;
$('q').oninput = e => { query = e.target.value; renderNav(); };
['all', 'major', 'todo'].forEach(f => $('f-' + f).onclick = () => {
  filter = f; ['all', 'major', 'todo'].forEach(g => $('f-' + g).setAttribute('aria-pressed', g === f)); renderNav();
});
window.addEventListener('hashchange', route);
$('count').textContent = AR(RULES.length);
route();
</script>
